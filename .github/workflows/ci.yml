name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OSHC_OFFLINE: "1"
      OSHC_ENABLE_LIVE: "0"
      OSHC_MODEL: "claude-haiku-4-5-20251001"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies only
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -e ".[dev]"
      - name: Restore verified public source snapshots
        run: python scripts/bootstrap_sources.py
      - name: Contract, arithmetic and guardrail tests
        run: python -m pytest tests -q
      - name: Fail if a secret or a real document was committed
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath
          import subprocess

          # Preserve the three existing synthetic research responses only.
          # Student and customer runtime responses must never be committed.
          legacy_cache = {
              "cache/llm/.gitkeep",
              "cache/llm/9b998288132e2e80759d7baf5d6e7b9b419d03da9b82207ecc5bc2a6bbde8c59.json",
              "cache/llm/v2/3f85f25a9e65976aaa59cf24bb4212078958e05480464753c1b1588762796384.json",
              "cache/llm/v2/79edc78aed0b2db4131b17dd5ff136e5e14f94371f7acdcc998e0ec85f8e4134.json",
          }
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          blocked = []
          for name in filter(None, tracked):
              path = PurePosixPath(name)
              secret = (path.name == ".env" or
                        (path.name.startswith(".env.") and path.name != ".env.example") or
                        name.endswith(".key") or name.endswith(".streamlit/secrets.toml"))
              private = ("real" in path.parts or name.endswith(".real.pdf") or
                         name.startswith(("data/freeze/", "data/private_runtime/", "cache/live/")) or
                         (name.startswith("data/heldout/") and path.name != ".gitkeep"))
              runtime_cache = name.startswith("cache/llm/") and name not in legacy_cache
              if secret or private or runtime_cache:
                  blocked.append(name)
          if blocked:
              raise SystemExit("Blocked private or runtime paths: " + ", ".join(blocked))
          print("No secret, real-document, private-ledger or runtime-response paths tracked.")
          PY
