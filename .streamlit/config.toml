[server]
address = "127.0.0.1"
maxUploadSize = 10
enableXsrfProtection = true
enableCORS = true
# Serves the bundled fonts in app/static. No network font requests.
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

# Brand tokens live here and only here. A partner can swap these values for their
# own palette and typeface without touching any page code.
[theme]
base = "light"
# Swinburne-inspired: red, black and greys. Red #D50032 is 5.4:1 on white, so it is
# safe for small text, buttons and the focus ring.
primaryColor = "#D50032"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F4"
textColor = "#111111"
linkColor = "#B4001F"
linkUnderline = true
borderColor = "#D6D6D6"
showWidgetBorder = true
baseRadius = "0.25rem"
buttonRadius = "0.25rem"
paddingTop = "3rem"
# Letters: Atkinson Hyperlegible Next, designed by the Braille Institute so similar
# letters stay distinct. Digits: plain Noto Sans numerals, because Atkinson's slashed
# zero reads oddly in "000" and in dollar amounts. Hindi: Noto Sans Devanagari.
font = "Atkinson Hyperlegible Next, Noto Sans Digits, Noto Sans Devanagari, sans-serif"
headingFont = "Atkinson Hyperlegible Next, Noto Sans Digits, Noto Sans Devanagari, sans-serif"
baseFontSize = 17
headingFontSizes = ["2.25rem", "1.45rem", "1.15rem"]
headingFontWeights = [700, 700, 600]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 700
# Information boxes stay neutral so red keeps its meaning.
blueColor = "#333333"
blueBackgroundColor = "#F4F4F4"
blueTextColor = "#111111"
greenColor = "#2E7D46"
greenBackgroundColor = "#E6F3E9"
greenTextColor = "#1D5530"
yellowBackgroundColor = "#FFF4D6"
yellowTextColor = "#6B4A00"
redColor = "#D50032"
redBackgroundColor = "#FBE8EC"
redTextColor = "#A3001F"
chartCategoricalColors = ["#D50032", "#111111", "#767676", "#8C0020", "#B3B3B3"]

[[theme.fontFaces]]
family = "Atkinson Hyperlegible Next"
url = "app/static/fonts/atkinson-hyperlegible-next-latin-400-normal.woff2"
weight = "400"
style = "normal"
unicodeRange = "U+0000-002F, U+003A-FFFF"

[[theme.fontFaces]]
family = "Atkinson Hyperlegible Next"
url = "app/static/fonts/atkinson-hyperlegible-next-latin-600-normal.woff2"
weight = "600"
style = "normal"
unicodeRange = "U+0000-002F, U+003A-FFFF"

[[theme.fontFaces]]
family = "Atkinson Hyperlegible Next"
url = "app/static/fonts/atkinson-hyperlegible-next-latin-700-normal.woff2"
weight = "700"
style = "normal"
unicodeRange = "U+0000-002F, U+003A-FFFF"

[[theme.fontFaces]]
family = "Noto Sans Devanagari"
url = "app/static/fonts/noto-sans-devanagari-devanagari-400-normal.woff2"
