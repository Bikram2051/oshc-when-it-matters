[[theme.fontFaces]]
family = "Noto Sans Devanagari"
url = "app/static/fonts/noto-sans-devanagari-devanagari-600-normal.woff2"
weight = "600"
style = "normal"

[[theme.fontFaces]]
family = "Noto Sans Devanagari"
url = "app/static/fonts/noto-sans-devanagari-devanagari-700-normal.woff2"
weight = "700"
style = "normal"

[[theme.fontFaces]]
family = "Noto Sans Digits"
