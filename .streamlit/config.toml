[server]
address = "127.0.0.1"
maxUploadSize = 10
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[theme]
base = "light"
primaryColor = "#D50032"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F4"
textColor = "#111111"
linkColor = "#B4001F"
borderColor = "#D6D6D6"
blueColor = "#333333"
blueBackgroundColor = "#F4F4F4"
blueTextColor = "#111111"
redColor = "#D50032"
redBackgroundColor = "#FBE8EC"
redTextColor = "#A3001F"
baseRadius = "0.25rem"
buttonRadius = "0.25rem"
showWidgetBorder = true
font = "sans-serif"
headingFont = "sans-serif"
headingFontSizes = ["2.75rem", "1.75rem", "1.25rem"]
headingFontWeights = [800, 700, 700]
chartCategoricalColors = ["#D50032", "#111111", "#767676", "#8C0020", "#B3B3B3"]
